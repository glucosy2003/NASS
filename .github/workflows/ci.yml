name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DJANGO_DEBUG: "True"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django checks
        run: python backend/manage.py check

      - name: Run the test suite
        run: python backend/manage.py test sales website

      - name: Verify the seed database is clean
        run: |
          python -c "import sqlite3; c=sqlite3.connect('database/seed.sqlite3'); q=lambda t: c.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]; assert q('sales_category') == 9; assert q('sales_item') == 0 and q('sales_sale') == 0 and q('sales_adminuser') == 0; assert q('sales_stockadjustment') == 0; print('seed database is clean')"
