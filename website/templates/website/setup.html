{% extends "website/base.html" %}
{% load static %}

{% block title %}Initial Setup{% endblock %}

{% block fullpage %}
<div class="login-page">
    <div class="login-card">
        <img src="{% static 'website/images/logo.png' %}" alt="Logo" style="width:120px; margin:0 auto 20px; display:block;">
        <h1 class="login-title">NASS Initial Setup</h1>
        <p class="login-subtitle">Create the owner admin account to get started.</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" name="full_name" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email (optional)</label>
                <input type="email" class="form-input" name="email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" name="password" placeholder="Min 4 characters" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-input" name="confirm_password" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="login-btn" style="background:var(--success);">Create Owner Account</button>
        </form>
    </div>
</div>
{% endblock %}
